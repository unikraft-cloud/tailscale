name: release

on:
  push:
    branches: [prod-staging, prod-stable, prod-preview]
  workflow_dispatch:
    inputs:
      publish_distro:
        description: 'Distro to publish (deb11, deb12, deb13, ubuntu24.04, ubuntu26.04)'
        type: choice
        default: 'all'
        options:
          - all
          - deb11
          - deb12
          - deb13
          - ubuntu24.04
          - ubuntu26.04

permissions:
  contents: write
  packages: write

jobs:
  setup_matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set_matrix.outputs.matrix }}
    steps:
      - id: set_matrix
        run: |
          SELECTED="${{ github.event.inputs.publish_distro }}"

          ALL='{"include":[
            {"name":"deb11","distro_codename":"bullseye","container":"debian:11","nfpm_file":"nfpm.yaml.deb11"},
            {"name":"deb12","distro_codename":"bookworm","container":"debian:12","nfpm_file":"nfpm.yaml.deb12"},
            {"name":"deb13","distro_codename":"trixie","container":"debian:13","nfpm_file":"nfpm.yaml.deb13"},
            {"name":"ubuntu24.04","distro_codename":"noble","container":"ubuntu:24.04","nfpm_file":"nfpm.yaml.ubuntu24.04"},
            {"name":"ubuntu26.04","distro_codename":"resolute","container":"ubuntu:26.04","nfpm_file":"nfpm.yaml.ubuntu26.04"}
          ]}'

          if [ -z "${SELECTED}" ] || [ "${SELECTED}" = "all" ]; then
            echo "matrix=$(echo "${ALL}" | jq -c '.')" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=$(echo "${ALL}" | jq -c "{include: [.include[] | select(.name == \"${SELECTED}\")]}")" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: setup_matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup_matrix.outputs.matrix) }}
    outputs:
      pkg_version: ${{ steps.package.outputs.pkg_version }} # Expose step output as job output
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    env:
      GO_VERSION: stable
      PYTHONDONTWRITEBYTECODE: 1
      UKP_PACKAGE: /platform-tailscaled-install
    steps:
    - name: Install checkout dependencies
      run: |
        set -xe;
        apt-get update;
        apt-get install --no-install-recommends -y ca-certificates
        apt-get install --no-install-recommends -y git

    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: false

    - name: Install build & release dependencies
      uses: ./.github/actions/install_dependencies

    - name: Set up Go ${{ env.GO_VERSION }}
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Build
      id: build
      uses: ./.github/actions/build

    - name: Package
      id: package
      uses:  ./.github/actions/package
      with:
        nfpm_file: "${{ matrix.nfpm_file }}"
        distro: "${{ matrix.name }}"

    - name: Upload build artifacts to GitHub
      uses: actions/upload-artifact@v4
      with:
        name: platform-tailscaled-${{ matrix.name }}-latest
        path: /dist
        if-no-files-found: error
        retention-days: 1
        overwrite: true

    - name: Publish to Gemfury
      if: ${{ (matrix.name == 'deb11') && (github.ref == 'refs/heads/prod-stable' || github.ref == 'refs/heads/prod-staging') }}
      shell: bash
      run: |
        set -xe
        if [[ "$GITHUB_REF" == "refs/heads/prod-stable" ]]; then
          FUSER="$FURY_USER_STABLE"
          FTOKEN="$FURY_TOKEN_STABLE"
        fi
        fury push "$(ls /dist/*.deb)" --quiet --account "$FUSER" --api-token "$FTOKEN"
      env:
        FURY_TOKEN_STABLE: ${{ secrets.FURY_TOKEN }}
        FURY_USER_STABLE: ${{ secrets.FURY_USER }}
        FUSER: ${{ secrets.FURY_USER_STAGING }}
        FTOKEN: ${{ secrets.FURY_TOKEN_STAGING }}

    - name: Publish to APT repository
      uses: ./.github/actions/publish
      with:
        distro: "${{ matrix.distro_codename }}"
        pkg_token: ${{ secrets.PKG_TOKEN }}
        pkg_component: ${{ steps.package.outputs.pkg_component }}
        pkg_feed: ${{ steps.package.outputs.pkg_feed }}
        pkg_dir: "/dist"

  # TODO: (TBD) Add a job to deploy release package to ukp-staging environment
  # get package version from release job output
